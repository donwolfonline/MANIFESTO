    <title>MANIFESTO.md — A Working Manifesto on Quiet Craft</title>

      name="description"
      content="A personal manifesto written as a plain-text Markdown file and rendered as an editorial, quiet web page on durable tools, attention, and human craft."

      property="og:description"

      property="og:image"
      content="https://manifesto.yourdomain.com/og-image.png"
