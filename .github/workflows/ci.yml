name: CI

# Runs on every pull request, and is reused by deploy-production.yml so main
# is never deployed without passing the exact same checks.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (app, api, configs)
        run: npm run typecheck

      - name: Unit & component tests (Vitest)
        run: npm run test:unit

  build:
    name: Build · Bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Production build (MDX + Zod content validation)
        run: npm run build

      - name: Enforce bundle size budget
        run: npm run budget

      - name: Upload dist for E2E jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  e2e:
    name: E2E · ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: E2E + axe-core accessibility tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Core Web Vitals check (mid-range mobile emulation)
        if: matrix.project == 'chromium'
        run: npm run perf:check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Single required status check for branch protection
  ci-passed:
    name: CI passed
    if: always()
    needs: [quality, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        env:
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if [ "$ANY_FAILED" = "true" ]; then
            printf 'One or more CI jobs did not succeed:\n%s\n' "$NEEDS_JSON"
            exit 1
          fi
          echo "All CI jobs passed."
