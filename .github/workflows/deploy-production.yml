name: Deploy Production

# On merge to main: re-run the full CI suite on the merge commit, then deploy
# the exact same commit to Vercel production and smoke-test it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production (Vercel)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check Vercel deployment secrets
        id: vercel-config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Missing VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID repository secret."
              exit 1
            fi
            echo "::notice::VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID secret is not set; skipping Vercel production deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.vercel-config.outputs.ready == 'true'
        uses: actions/checkout@v7

      - if: steps.vercel-config.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.vercel-config.outputs.ready == 'true'
        run: npm ci

      - name: Pull Vercel production environment
        if: steps.vercel-config.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        if: steps.vercel-config.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production build
        id: deploy
        if: steps.vercel-config.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1 | tr -d '[:space:]')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployed: $url"

      - name: Smoke-test production (home, security headers, /api/health)
        if: steps.vercel-config.outputs.ready == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS -o /dev/null "$base/"; then break; fi
            echo "Waiting for $base (attempt $attempt)..."; sleep 6
          done

          headers=$(curl -fsSI "$base/")
          for h in content-security-policy x-content-type-options referrer-policy permissions-policy strict-transport-security; do
            echo "$headers" | grep -qi "^$h:" || { echo "Missing header: $h"; exit 1; }
          done

          curl -fsS "$base/" | grep -q "WORKING_COPY.md" || { echo "Home page missing title marker"; exit 1; }
          curl -fsS "$base/api/health" | grep -q '"ok":true' || { echo "/api/health is not healthy"; exit 1; }
          echo "✓ Production smoke test passed for $base"
